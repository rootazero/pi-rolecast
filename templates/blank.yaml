# Empty pre-fill. Use when no language-specific defaults apply.
#
# v0.6.0: bindings use the new active role names. The legacy aliases
# (coding-implementer / coding-reviewer / coding-docs / coding-orchestrator)
# are rewritten automatically by LEGACY_ROLE_ALIASES with a DEPRECATED or
# REMOVED warning, so older profiles keep loading without edits. New
# profiles should use the names below.
#
# Pick the bindings you actually want. The audit triad (countersign /
# notary / secretariat) is OPT-IN — keep it commented out unless you want
# strict two-pair-of-eyes governance. The fixer is the finalization phase
# of a coder dispatch (ADR-0034); bind it if you want a hard gate between
# apply and merge.

