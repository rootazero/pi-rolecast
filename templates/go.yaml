# Pre-fill for Go projects. Edit fields to match your toolchain.
#
# v0.8.0: the v0.7.0 LEGACY_ROLE_ALIASES shim has been hard-deleted; the
# legacy role-pack files (coding-{implementer,reviewer,docs,orchestrator}.md)
# are gone from role-packs/coding/. Old role names continue to hard-fail at
# load time with a clear migration hint. Profiles still on v0.6.0 names must
# rename (or remove) the binding + contracts entries and `git rm` any forked
# legacy files. See references/profile-schema.md for the migration guide.
#
# v0.8.0 also adds the audit dispatch helpers (resolveAuditDispatchPlan /
# recordAuditVerdict) for workflows that retry on audit rejection. Bind the
# audit triad (countersign / notary / secretariat) if you want the
# gate-runner verdict short-circuit to drive your resubmit loop.
#
# The fixer is the finalization phase of a coder dispatch (ADR-0034); bind it
# if you want a hard gate between apply and merge.

framework_version: 0.2.0
name: my-go-project
description: |
  Workflow for a Go project.

workflow:
  role_groups: [coding]

gates:
  compile:
    commands:
      - go build ./...
    timeout: 300
  lint:
    commands:
      - go vet ./...
    timeout: 300
  test:
    commands:
      - go test ./...
    timeout: 900

bindings:
  coding-architect: {alias: opus-thinking-medium, channels: [official]}
  coding-planner:   {alias: deepseek-verifiable,  channels: [official]}
  coding-coder:     {alias: deepseek-verifiable,  channels: [official]}
  coding-tester:    {alias: deepseek-verifiable,  channels: [official]}
  coding-judge:     {alias: gpt-judgment-high,    channels: [official, relay-default]}
  coding-mapper:    {alias: deepseek-verifiable,  channels: [official]}
  coding-profiler:  {alias: deepseek-verifiable,  channels: [official]}
  coding-auditor:   {alias: opus-thinking-high,   channels: [official]}
  coding-canary:    {alias: minimax-fast,         channels: [official]}
  coding-diarist:   {alias: minimax-medium,       channels: [official]}

# Optional: opt into the audit triad + fixer. Uncomment to bind.
#   coding-countersign: {alias: opus-thinking-high,   channels: [official]}
#   coding-notary:      {alias: deepseek-verifiable,  channels: [official]}
#   coding-secretariat: {alias: minimax-medium,       channels: [official]}
#   coding-fixer:       {alias: deepseek-verifiable,  channels: [official]}

non_negotiables:
  forbidden_patterns:
    - pattern: 'panic\('
      message: "no panic() in production code"

escalation:
  max_attempts: 2
  on_permanent_failure: stop
  preserve_logs: true
