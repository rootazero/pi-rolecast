framework_version: 0.1.0
name: my-go-project
description: |
  Workflow for a Go project.

gates:
  compile:
    commands:
      - go build ./...
    timeout: 300
  lint:
    commands:
      - go vet ./...
    timeout: 300
  test:
    commands:
      - go test ./...
    timeout: 900

bindings:
  architect:      {alias: opus-thinking-medium, channels: [official]}
  planner:        {alias: deepseek-verifiable, channels: [official]}
  implementer:    {alias: deepseek-verifiable, channels: [official]}
  tester:         {alias: deepseek-verifiable, channels: [official]}
  reviewer:       {alias: gpt-judgment-high, channels: [official, relay-default]}
  mapper:         {alias: deepseek-verifiable, channels: [official]}
  profiler:       {alias: deepseek-verifiable, channels: [official]}
  auditor:        {alias: opus-thinking-high, channels: [official]}
  canary:         {alias: minimax-fast, channels: [official]}
  docs:           {alias: minimax-medium, channels: [official]}
  orchestrator:   {alias: gpt-judgment-medium, channels: [official, relay-default]}

non_negotiables:
  forbidden_patterns:
    - pattern: 'panic\('
      message: "no panic() in production code"

escalation:
  max_attempts: 2
  on_permanent_failure: stop
  preserve_logs: true
