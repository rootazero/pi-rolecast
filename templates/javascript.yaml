# Pre-fill for plain JavaScript projects (no TypeScript). Edit fields to match your toolchain.
#
# v0.6.0: bindings use the new active role names. The legacy aliases
# (coding-implementer / coding-reviewer / coding-docs / coding-orchestrator)
# are rewritten automatically by LEGACY_ROLE_ALIASES with a DEPRECATED or
# REMOVED warning, so older profiles keep loading without edits. New
# profiles should use the names below.
#
# The audit triad (countersign / notary / secretariat) is OPT-IN — keep it
# commented out unless you want strict two-pair-of-eyes governance. The
# fixer is the finalization phase of a coder dispatch (ADR-0034); bind it
# if you want a hard gate between apply and merge.

framework_version: 0.2.0
name: my-js-project
description: |
  Workflow for a plain JavaScript project (no TypeScript).

workflow:
  role_groups: [coding]

gates:
  compile:
    commands:
      - node --check $(find . -name '*.js' -not -path './node_modules/*' -not -path './dist/*' | head -50)
    timeout: 300
  lint:
    commands:
      - npx eslint .
    timeout: 300
  test:
    commands:
      - npx jest
    timeout: 900

bindings:
  coding-architect: {alias: opus-thinking-medium, channels: [official]}
  coding-planner:   {alias: deepseek-verifiable,  channels: [official]}
  coding-coder:     {alias: deepseek-verifiable,  channels: [official]}
  coding-tester:    {alias: deepseek-verifiable,  channels: [official]}
  coding-judge:     {alias: gpt-judgment-high,    channels: [official, relay-default]}
  coding-mapper:    {alias: deepseek-verifiable,  channels: [official]}
  coding-profiler:  {alias: deepseek-verifiable,  channels: [official]}
  coding-auditor:   {alias: opus-thinking-high,   channels: [official]}
  coding-canary:    {alias: minimax-fast,         channels: [official]}
  coding-diarist:   {alias: minimax-medium,       channels: [official]}

# Optional: opt into the audit triad + fixer. Uncomment to bind.
#   coding-countersign: {alias: opus-thinking-high,   channels: [official]}
#   coding-notary:      {alias: deepseek-verifiable,  channels: [official]}
#   coding-secretariat: {alias: minimax-medium,       channels: [official]}
#   coding-fixer:       {alias: deepseek-verifiable,  channels: [official]}

non_negotiables:
  forbidden_patterns: []

escalation:
  max_attempts: 2
  on_permanent_failure: stop
  preserve_logs: true
