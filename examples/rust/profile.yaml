# Reference profile reproducing today's rust-agent-workflow routing,
# updated for pi-rolecast v0.2.0 (grouped roles, hyphen-prefixed names).
# Generated manually from the old SKILL.md; this is the ground truth
# users cross-check their scaffolder-generated profile against.

framework_version: 0.2.0
name: rust-rolecast-example
description: |
  Reference Rust profile preserving the routing decisions of the original
  rust-agent-workflow skill, updated to the v0.2.0 grouped-role schema.
  Use scaffolder init --template rust in your project to generate a
  similar profile; this file is the canonical reference for cross-checking.

workflow:
  role_groups: [coding]

gates:
  compile:
    commands: [cargo check --message-format short --all-targets]
    timeout: 300
  lint:
    commands: [cargo clippy -- -D warnings]
    timeout: 300
  test:
    commands: [cargo test]
    timeout: 900

bindings:
  coding-architect:    {alias: opus-thinking-medium, channels: [official]}
  coding-planner:      {alias: deepseek-verifiable, channels: [official]}
  coding-implementer:  {alias: deepseek-verifiable, channels: [official]}
  coding-tester:       {alias: deepseek-verifiable, channels: [official]}
  coding-reviewer:     {alias: gpt-judgment-high, channels: [official, relay-default]}
  coding-mapper:       {alias: deepseek-verifiable, channels: [official]}
  coding-profiler:     {alias: deepseek-verifiable, channels: [official]}
  coding-auditor:      {alias: opus-thinking-high, channels: [official]}
  coding-canary:       {alias: minimax-fast, channels: [official]}
  coding-docs:         {alias: minimax-medium, channels: [official]}
  coding-orchestrator: {alias: gpt-judgment-medium, channels: [official, relay-default]}

non_negotiables:
  forbidden_patterns:
    - pattern: '#\[allow\('
      message: "never silence a diagnostic with #[allow(...)]"
    - pattern: '\.unwrap\(\)'
      message: "no bare .unwrap() — handle the Result"

escalation:
  max_attempts: 2
  on_permanent_failure: stop
  preserve_logs: true
