name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Single concurrency group across all tag builds — never run two publishes
# in parallel for the same package.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# OIDC trusted publishing (npm): id-token: write is required so npm can
# mint provenance attestations without a long-lived NPM_TOKEN secret.
# Configure trusted publisher on https://www.npmjs.com/package/pi-rolecast/access
# (Publishing access -> Trusted Publishers -> Add GitHub Actions) with:
#   Repository: rootazero/pi-rolecast
#   Workflow filename: release.yml
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (Node)
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test (Python)
        run: pytest tests/unit/ -v

      - name: Publish to npm
        # OIDC trusted publishing: npm auto-mints a provenance attestation
        # from the workflow's id-token; no NPM_TOKEN secret required.
        # If trusted publishing is NOT yet configured on npmjs.com, set the
        # NPM_TOKEN secret and uncomment the env: line below to fall back
        # to classic token auth.
        id: publish
        # continue-on-error: true lets the verify step always run so it can
        # distinguish npm 11 first-publish noise (E404 with version live)
        # from a genuine publish failure. Without it the workflow aborts
        # before we get to npm view.
        continue-on-error: true
        run: npm publish --access public --provenance
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Two-step publish gate for npm 11 OIDC trusted publishing:
      # 1. `npm publish` may exit 1 with `E404 Not Found` even when the
      #    tarball was uploaded and the provenance was published to sigstore
      #    (observed for pi-rolecast v0.3.0 and v0.3.1). Root cause: npm CLI
      #    makes a HEAD/PUT verification call against the package root that
      #    hits a stale CDN edge and returns 404, even though the actual
      #    version is live.
      # 2. The verify step below ALWAYS runs (if: always()) so it can decide
      #    pass/fail based on the real registry state. It exits 0 if the
      #    version is live (treating the E404 as noise) and exits 1 only if
      #    the version is genuinely missing.
      - name: Verify publish succeeded
        if: always()
        env:
          VERSION: ${{ github.ref_name }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Publish step reported success; no verification needed."
            exit 0
          fi
          echo "Publish step reported '$PUBLISH_OUTCOME'; checking whether version is actually live (npm 11 first-publish noise workaround)."
          sleep 10
          if npm view "pi-rolecast@${VERSION}" version; then
            echo "::notice::Version ${VERSION} is live on npm; treating publish step as success despite E404 noise."
            exit 0
          fi
          echo "::error::Version ${VERSION} not found on npm; publish genuinely failed."
          exit 1
